name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Match netlify.toml NODE_VERSION.
          node-version: '20.20.0'
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc -b
      - name: Lint
        run: npx eslint .
      - name: Test
        run: npx vitest run
      - name: Build
        run: npx vite build
