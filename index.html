<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Hero photo (the LCP): preload the AVIF the <picture> in CinematicIntro
         selects. Browsers without AVIF ignore the typed preload harmlessly and
         fall through to the WebP/JPEG sources. -->
    <link rel="preload" as="image" href="/images/piranha-hero.avif" type="image/avif" fetchpriority="high" />
    <!-- Fonts are self-hosted (see @font-face in src/index.css). Preload the
         two faces used above the fold so text paints in the right face. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/libre-caslon-display-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin-var.woff2" crossorigin />
    <!--
      NOTE: the <title>, description/OG/Twitter metas, and the canonical link
      below are rewritten per-route at the edge by netlify/edge-functions/og.ts.
      Keep them as standard <meta .../> and <link .../> tags; if you reformat
      or remove them, update og.ts to match.
    -->
    <title>The Piranha Project</title>
    <meta name="description" content="See every rule between you and a finished building: what it costs, how long it takes, and where it has gone too far. Built from public records, in plain English." />
    <link rel="canonical" href="https://thepiranhaproject.com/" />
    <!-- Absolute URLs for full social-scraper support. Update if the domain changes. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://thepiranhaproject.com/" />
    <meta property="og:title" content="The Piranha Project" />
    <meta property="og:description" content="See every rule between you and a finished building: what it costs, how long it takes, and where it has gone too far. Built from public records, in plain English." />
    <meta property="og:image" content="https://thepiranhaproject.com/logo/og-card.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Piranha Project" />
    <meta name="twitter:description" content="What it really takes to build, mapped from public records and shown in plain English." />
    <meta name="twitter:image" content="https://thepiranhaproject.com/logo/og-card.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "The Piranha Project",
        "url": "https://thepiranhaproject.com/",
        "description": "Parcel-level building feasibility, cost, and timeline estimates for ten US cities, drawn from public zoning and parcel records.",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "creator": {
          "@type": "Organization",
          "name": "Louisburg Strategies",
          "url": "https://louisburgstrategies.com"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
