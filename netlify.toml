[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20.20.0"

[[edge_functions]]
  path = "/*"
  function = "og"
  # Only HTML page requests need OG-tag rewriting. Exclude static assets so the
  # edge function doesn't needlessly fire on images, fonts, icons, sitemap, etc.
  excludedPath = [
    "/assets/*",
    "/logo/*",
    "/cities/*",
    "/.netlify/*",
    "/*.png",
    "/*.jpg",
    "/*.jpeg",
    "/*.svg",
    "/*.ico",
    "/*.webp",
    "/*.woff",
    "/*.woff2",
    "/*.xml",
    "/*.txt",
  ]

# Vite content-hashes every file in /assets, so they are immutable by
# construction — a changed file gets a new name. Without this, Netlify served
# them with max-age=0 and browsers re-validated the ~480 kB-gzip mapbox chunk
# on every visit.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Self-hosted fonts are versioned by filename; safe to cache long.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers for every response. The CSP's only third party is Mapbox GL
# (API/tiles/events via fetch, blob: web workers, data:/blob: images, injected
# <style> tag — hence 'unsafe-inline' in style-src, which React's inline style
# attributes also need). Fonts are self-hosted under /fonts. If you add a new
# third-party script, stylesheet, or API, extend the matching directive or the
# browser will block it.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # connect-src hosts: 'self' (the /api functions, incl. /api/parcel-shape),
    # *.mapbox.com (basemap), and the zoning-overlay FeatureServer hosts the
    # BROWSER fetches directly for WO-8.1b. Every parcel endpoint is proxied
    # server-side via /api, so only the client-side zoning hosts are listed:
    #   *.arcgis.com           — Boston, NYC, Seattle, Austin (Esri-hosted layers)
    #   gisapps.chicago.gov    — Chicago zoning MapServer/15
    #   maps2.dcgis.dc.gov     — DC zoning MapServer/24
    #   sfplanninggis.org      — San Francisco zoning MapServer/3
    #   maps.lacity.org        — Los Angeles zoning MapServer/71
    # (Denver/Minneapolis have no client overlay — see cities.ts — so no host.)
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://*.mapbox.com; connect-src 'self' https://*.mapbox.com https://*.arcgis.com https://gisapps.chicago.gov https://maps2.dcgis.dc.gov https://sfplanninggis.org https://maps.lacity.org; worker-src 'self' blob:; child-src blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
